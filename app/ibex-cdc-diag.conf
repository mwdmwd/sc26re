# Diagnostic build: keep only the CDC-ACM shell over USB. Do not enumerate
# Valve USB HID, so Steam cannot route inputs over USB while radio logs are
# captured on the same cable.
CONFIG_IBEX_USB_CDC_ONLY=y
CONFIG_IBEX_USB_HID=n
CONFIG_USBD_HID_SUPPORT=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_VID=0x28de
CONFIG_CDC_ACM_SERIAL_PID=0x1304
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Valve Corporation"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="SC26re Ibex CFW CDC diag"
